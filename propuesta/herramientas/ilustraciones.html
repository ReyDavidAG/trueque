<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ilustraciones · El Trueque</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Figtree:wght@400..800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/app.css">
<style>
  body { padding: 24px; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
  .gal__item { background: var(--color-estraza); border-radius: 14px; padding: 14px; box-shadow: var(--shadow-card); }
  .gal__sizes { display: flex; align-items: end; gap: 14px; }
  .gal__big { width: 200px; background: var(--color-amate); border-radius: 10px; padding: 8px; }
  .gal__mid { width: 72px; background: var(--color-amate); border-radius: 8px; padding: 4px; }
  .gal__sm { width: 44px; background: var(--color-amate); border-radius: 6px; padding: 2px; }
  .gal__group { grid-column: 1 / -1; margin-top: 8px; color: var(--color-cacao); }
  .gal__name { font-family: var(--font-mono); font-size: 12px; margin-top: 8px; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<h1 class="h2" style="margin-bottom:16px">Ilustraciones · revisión a tamaño real</h1>
<div class="gal" id="gal"></div>
<script type="module">
  import { art, artGroups } from "../js/art.js";
  const stalls = ["grana", "anil", "nopal", "achiote", "maiz", "cacao"];
  let i = 0;
  document.getElementById("gal").innerHTML = artGroups().map((g) => `<h2 class="h3 gal__group">${g.label}</h2>` + g.items.map((a) => {
    const s = stalls[i++ % stalls.length];
    return `<div class="gal__item" data-stall="${s}"><div class="gal__sizes"><div class="gal__big">${art(a.id, a.label)}</div><div class="gal__mid">${art(a.id, a.label)}</div><div class="gal__sm">${art(a.id, a.label)}</div></div><p class="gal__name"><b>${a.label}</b><span>${a.id} · ${s}</span></p></div>`;
  }).join("")).join("");
</script>
</body>
</html>
